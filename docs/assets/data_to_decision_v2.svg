<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Data to decision</title>
  <desc id="desc">How domain knowledge, EDA, and error analysis led to modeling decisions.</desc>

  <style>
    .bg { fill: #0d1117; }
    .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .title { fill: #f0f6fc; font: 700 30px system-ui, -apple-system, Segoe UI, sans-serif; }
    .sub { fill: #8b949e; font: 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .section { fill: #f0f6fc; font: 700 20px system-ui, -apple-system, Segoe UI, sans-serif; }
    .label { fill: #c9d1d9; font: 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .small { fill: #8b949e; font: 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .box-blue { fill: #1f6feb; }
    .box-green { fill: #238636; }
    .box-orange { fill: #9e6a03; }
    .box-red { fill: #da3633; }
    .box-purple { fill: #8957e5; }
    .arrow { stroke: #6e7681; stroke-width: 2.5; marker-end: url(#arrowhead); }
    .boxtext { fill: white; font: 700 14px system-ui, -apple-system, Segoe UI, sans-serif; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6e7681"></polygon>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760" rx="18"></rect>

  <text class="title" x="50" y="60">How domain insight became modeling decisions</text>
  <text class="sub" x="50" y="90">Two examples from the project: zero-heavy targets and breakout prediction errors</text>

  <!-- Left panel -->
  <rect class="panel" x="45" y="130" width="525" height="565" rx="16"></rect>
  <text class="section" x="70" y="170">A. Why a single regression was not enough</text>
  <text class="small" x="70" y="195">Observation from EDA</text>

  <rect class="box-orange" x="90" y="220" width="435" height="52" rx="10"></rect>
  <text class="boxtext" x="110" y="252">Many players had next_goals = 0</text>

  <line class="arrow" x1="307" y1="272" x2="307" y2="312"></line>

  <rect class="box-blue" x="90" y="312" width="435" height="72" rx="10"></rect>
  <text class="boxtext" x="110" y="342">Football interpretation</text>
  <text class="boxtext" x="110" y="362">Zero goals mixed low scorers and players who left the Big5 leagues</text>

  <line class="arrow" x1="307" y1="384" x2="307" y2="424"></line>

  <rect class="box-purple" x="90" y="424" width="435" height="72" rx="10"></rect>
  <text class="boxtext" x="110" y="454">Problem redesign</text>
  <text class="boxtext" x="110" y="474">Separate “Big5 presence” from “goals if present”</text>

  <line class="arrow" x1="307" y1="496" x2="307" y2="536"></line>

  <rect class="box-green" x="90" y="536" width="435" height="96" rx="10"></rect>
  <text class="boxtext" x="110" y="566">Final modeling decision</text>
  <text class="boxtext" x="110" y="586">Model A: predict next-season Big5 presence</text>
  <text class="boxtext" x="110" y="606">Model B: predict goals conditional on presence</text>

  <text class="small" x="70" y="665">Result: Hard Two-stage improved overall MAE by handling exits more explicitly.</text>

  <!-- Right panel -->
  <rect class="panel" x="630" y="130" width="525" height="565" rx="16"></rect>
  <text class="section" x="655" y="170">B. Why transfer context became important</text>
  <text class="small" x="655" y="195">Observation from error analysis</text>

  <rect class="box-red" x="675" y="220" width="435" height="72" rx="10"></rect>
  <text class="boxtext" x="695" y="250">Breakout and decline cases had large errors</text>
  <text class="boxtext" x="695" y="270">Example pattern: sudden role or environment change</text>

  <line class="arrow" x1="892" y1="292" x2="892" y2="332"></line>

  <rect class="box-blue" x="675" y="332" width="435" height="72" rx="10"></rect>
  <text class="boxtext" x="695" y="362">Domain hypothesis</text>
  <text class="boxtext" x="695" y="382">Past stats alone miss transfers, new team context, and role changes</text>

  <line class="arrow" x1="892" y1="404" x2="892" y2="444"></line>

  <rect class="box-orange" x="675" y="444" width="435" height="72" rx="10"></rect>
  <text class="boxtext" x="695" y="474">Data action</text>
  <text class="boxtext" x="695" y="494">Add market value, transfer status, and new-team environment</text>

  <line class="arrow" x1="892" y1="516" x2="892" y2="556"></line>

  <rect class="box-green" x="675" y="556" width="435" height="76" rx="10"></rect>
  <text class="boxtext" x="695" y="586">Validation result</text>
  <text class="boxtext" x="695" y="606">Removing transfer context made development MAE worse</text>

  <text class="small" x="655" y="665">Conclusion: domain hypotheses were useful when they were turned into measurable features and tested.</text>

  <text class="small" x="50" y="730">This figure summarizes the project logic: domain question → data evidence → modeling decision.</text>
</svg>
