<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Final test error analysis</title>
  <desc id="desc">MAE and bias by actual scoring band for the locked test.</desc>
  <style>
    .bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:1}.title{fill:#f0f6fc;font:700 30px system-ui,-apple-system,Segoe UI,sans-serif}.sub{fill:#8b949e;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.h{fill:#f0f6fc;font:700 18px system-ui,-apple-system,Segoe UI,sans-serif}.t{fill:#c9d1d9;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.small{fill:#8b949e;font:13px system-ui,-apple-system,Segoe UI,sans-serif}.axis{stroke:#484f58;stroke-width:1}.blue{fill:#58a6ff}.red{fill:#f85149}.orange{fill:#d29922}.label{fill:#c9d1d9;font:13px system-ui,-apple-system,Segoe UI,sans-serif}.num{fill:#f0f6fc;font:700 15px system-ui,-apple-system,Segoe UI,sans-serif}
  </style>
  <rect class="bg" width="1200" height="720" rx="18"/>
  <text class="title" x="55" y="62">Where the final model fails</text>
  <text class="sub" x="55" y="90">Locked test · 2024-25 → 2025-26 · Hard Two-stage</text>

  <rect class="panel" x="45" y="130" width="540" height="500" rx="14"/>
  <text class="h" x="75" y="172">MAE by actual scoring band</text>
  <line class="axis" x1="115" y1="550" x2="525" y2="550"/>
  <line class="axis" x1="115" y1="230" x2="115" y2="550"/>
  <rect class="blue" x="150" y="488" width="58" height="62" rx="5"/><text class="num" x="158" y="478">2.003</text><text class="label" x="157" y="575">All</text>
  <rect class="orange" x="250" y="374" width="58" height="176" rx="5"/><text class="num" x="257" y="364">5.660</text><text class="label" x="260" y="575">10+</text>
  <rect class="orange" x="350" y="327" width="58" height="223" rx="5"/><text class="num" x="357" y="317">7.172</text><text class="label" x="360" y="575">15+</text>
  <rect class="red" x="450" y="226" width="58" height="324" rx="5"/><text class="num" x="454" y="216">10.426</text><text class="label" x="460" y="575">20+</text>
  <text class="small" x="75" y="610">The average score looks strong, but high scorers are much harder.</text>

  <rect class="panel" x="620" y="130" width="535" height="500" rx="14"/>
  <text class="h" x="650" y="172">Bias becomes more negative as goals rise</text>
  <text class="small" x="650" y="205">Bias = predicted - actual</text>
  <line class="axis" x1="690" y1="320" x2="1090" y2="320"/>
  <text class="label" x="655" y="325">0</text>
  <circle class="blue" cx="735" cy="310" r="8"/><text class="num" x="710" y="292">+0.327</text><text class="label" x="720" y="355">All</text>
  <circle class="orange" cx="835" cy="430" r="8"/><text class="num" x="805" y="412">-5.295</text><text class="label" x="820" y="455">10+</text>
  <circle class="orange" cx="935" cy="468" r="8"/><text class="num" x="905" y="450">-6.995</text><text class="label" x="920" y="493">15+</text>
  <circle class="red" cx="1035" cy="535" r="8"/><text class="num" x="1000" y="517">-9.954</text><text class="label" x="1020" y="560">20+</text>
  <text class="small" x="650" y="610">The model regresses rare elite scorers toward the majority of low scorers.</text>

  <text class="small" x="55" y="680">Interpretation: useful for overall expected goals, limited as a “next top scorer” discovery model.</text>
</svg>