<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">Locked Final Test — 모델이 잘하는 곳과 실패하는 곳</title>
<desc id="desc">실제 득점과 예측 득점 관계 및 고득점 구간별 MAE와 Bias를 보여주는 최종 오류 분석</desc>
<style>
.bg{fill:#fff}.panel{fill:#fff;stroke:#bcc7d4;stroke-width:1.4}.title{font:700 31px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#111827}.st{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#111827}.tx{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#273244}.sm{font:13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#58677a}.axis{stroke:#708090;stroke-width:1.2}.grid{stroke:#e5eaf0;stroke-width:1}.dark{fill:#1d4f8c}.mid{fill:#5794c5}.light{fill:#acd0e7}.vl{fill:#e5f0f7}.mae{fill:#447bb8}.bias{fill:#e67e22}.red{stroke:#d65252;stroke-width:2.4;stroke-dasharray:8 5;fill:none}
</style>
<rect class="bg" width="1400" height="660"/>
<text class="title" x="700" y="42" text-anchor="middle">Locked Final Test — 모델이 잘하는 곳과 실패하는 곳</text>

<!-- left -->
<rect class="panel" x="55" y="80" width="665" height="520"/>
<text class="st" x="387" y="115" text-anchor="middle">예측값이 전체 평균 쪽으로 수축한다</text>
<line class="axis" x1="110" y1="540" x2="680" y2="540"/><line class="axis" x1="110" y1="155" x2="110" y2="540"/>
<line class="grid" x1="110" y1="465" x2="680" y2="465"/><line class="grid" x1="110" y1="390" x2="680" y2="390"/><line class="grid" x1="110" y1="315" x2="680" y2="315"/><line class="grid" x1="110" y1="240" x2="680" y2="240"/>
<line class="grid" x1="225" y1="155" x2="225" y2="540"/><line class="grid" x1="340" y1="155" x2="340" y2="540"/><line class="grid" x1="455" y1="155" x2="455" y2="540"/><line class="grid" x1="570" y1="155" x2="570" y2="540"/>
<!-- density: most mass low-low, sparse high actual with predictions below diagonal -->
<g opacity=".96">
<circle class="dark" cx="120" cy="528" r="18"/><circle class="dark" cx="145" cy="520" r="20"/><circle class="dark" cx="170" cy="510" r="20"/><circle class="dark" cx="195" cy="498" r="19"/><circle class="mid" cx="220" cy="488" r="18"/><circle class="mid" cx="245" cy="478" r="17"/>
<circle class="dark" cx="130" cy="493" r="18"/><circle class="dark" cx="160" cy="482" r="19"/><circle class="mid" cx="190" cy="470" r="20"/><circle class="mid" cx="220" cy="458" r="20"/><circle class="mid" cx="250" cy="446" r="18"/><circle class="light" cx="280" cy="435" r="17"/>
<circle class="mid" cx="140" cy="455" r="16"/><circle class="mid" cx="175" cy="440" r="18"/><circle class="mid" cx="210" cy="426" r="19"/><circle class="mid" cx="245" cy="414" r="19"/><circle class="light" cx="280" cy="402" r="18"/><circle class="light" cx="315" cy="392" r="16"/>
<circle class="light" cx="180" cy="405" r="15"/><circle class="light" cx="225" cy="392" r="16"/><circle class="light" cx="270" cy="378" r="17"/><circle class="light" cx="315" cy="365" r="16"/><circle class="vl" cx="360" cy="355" r="15"/>
<circle class="vl" cx="250" cy="345" r="13"/><circle class="vl" cx="320" cy="335" r="14"/><circle class="vl" cx="390" cy="325" r="14"/><circle class="vl" cx="455" cy="300" r="13"/><circle class="vl" cx="520" cy="285" r="12"/><circle class="vl" cx="610" cy="260" r="11"/>
<!-- high actual / underpredicted points -->
<circle class="light" cx="340" cy="410" r="12"/><circle class="vl" cx="395" cy="395" r="11"/><circle class="vl" cx="455" cy="380" r="10"/><circle class="vl" cx="515" cy="365" r="9"/><circle class="vl" cx="570" cy="340" r="9"/><circle class="vl" cx="650" cy="295" r="9"/>
</g>
<line class="red" x1="110" y1="540" x2="680" y2="155"/>
<text class="sm" x="545" y="515">점선: 완벽한 예측</text>
<text class="tx" x="395" y="580" text-anchor="middle">실제 다음 시즌 Big5 득점</text>
<text class="tx" transform="translate(78 350) rotate(-90)" text-anchor="middle">Hard Two-stage 예측 득점</text>
<text class="sm" x="110" y="558">0</text><text class="sm" x="220" y="558">5</text><text class="sm" x="335" y="558">10</text><text class="sm" x="450" y="558">15</text><text class="sm" x="565" y="558">20</text><text class="sm" x="665" y="558">25+</text>

<!-- right -->
<rect class="panel" x="760" y="80" width="585" height="520"/>
<text class="st" x="1052" y="115" text-anchor="middle">고득점자일수록 과소예측이 빠르게 커진다</text>
<line class="axis" x1="815" y1="345" x2="1310" y2="345"/><line class="axis" x1="815" y1="155" x2="815" y2="545"/>
<line class="grid" x1="815" y1="205" x2="1310" y2="205"/><line class="grid" x1="815" y1="275" x2="1310" y2="275"/><line class="grid" x1="815" y1="415" x2="1310" y2="415"/><line class="grid" x1="815" y1="485" x2="1310" y2="485"/>
<!-- All -->
<rect class="mae" x="850" y="289" width="38" height="56"/><rect class="bias" x="892" y="336" width="38" height="9"/><text class="tx" x="869" y="281" text-anchor="middle">2.00</text><text class="sm" x="911" y="362" text-anchor="middle">+0.33</text>
<!-- 10+ -->
<rect class="mae" x="965" y="187" width="38" height="158"/><rect class="bias" x="1007" y="345" width="38" height="148"/><text class="tx" x="984" y="179" text-anchor="middle">5.66</text><text class="sm" x="1026" y="512" text-anchor="middle">-5.29</text>
<!-- 15+ -->
<rect class="mae" x="1080" y="144" width="38" height="201"/><rect class="bias" x="1122" y="345" width="38" height="196"/><text class="tx" x="1099" y="136" text-anchor="middle">7.17</text><text class="sm" x="1141" y="558" text-anchor="middle">-6.99</text>
<!-- 20+ -->
<rect class="mae" x="1195" y="105" width="38" height="240"/><rect class="bias" x="1237" y="345" width="38" height="238"/><text class="tx" x="1214" y="97" text-anchor="middle">10.43</text><text class="sm" x="1256" y="598" text-anchor="middle">-9.95</text>
<rect class="mae" x="825" y="135" width="23" height="13"/><text class="sm" x="855" y="146">MAE</text><rect class="bias" x="900" y="135" width="23" height="13"/><text class="sm" x="930" y="146">Bias</text>
<text class="sm" x="890" y="575" text-anchor="middle">전체</text><text class="sm" x="890" y="592" text-anchor="middle">n=926</text><text class="sm" x="1005" y="575" text-anchor="middle">10+</text><text class="sm" x="1005" y="592" text-anchor="middle">n=67</text><text class="sm" x="1120" y="575" text-anchor="middle">15+</text><text class="sm" x="1120" y="592" text-anchor="middle">n=22</text><text class="sm" x="1235" y="575" text-anchor="middle">20+</text><text class="sm" x="1235" y="592" text-anchor="middle">n=5</text>
<text class="tx" transform="translate(790 350) rotate(-90)" text-anchor="middle">Goals</text>
<text class="sm" x="1052" y="630" text-anchor="middle">전체 MAE는 낮지만 희소한 고득점 선수는 평균 방향으로 강하게 수축된다</text>
</svg>